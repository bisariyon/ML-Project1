<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Student Exam Performance Predictor — ML-powered tool to predict student math scores.">
    <title>Student Performance Predictor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e1a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: -15%;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, transparent 65%);
            border-radius: 50%;
            pointer-events: none;
            animation: blob 14s ease-in-out infinite alternate;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -20%;
            right: -10%;
            width: 55vw;
            height: 55vw;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.15) 0%, transparent 65%);
            border-radius: 50%;
            pointer-events: none;
            animation: blob 18s ease-in-out infinite alternate-reverse;
        }

        @keyframes blob {
            0% {
                transform: scale(1) translate(0, 0);
            }

            100% {
                transform: scale(1.15) translate(4%, 6%);
            }
        }

        .hero {
            position: relative;
            z-index: 1;
            animation: fadeUp 0.9s ease both;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(139, 92, 246, 0.14);
            border: 1px solid rgba(139, 92, 246, 0.35);
            color: #a78bfa;
            padding: 7px 18px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .badge-dot {
            width: 7px;
            height: 7px;
            background: #a78bfa;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        h1 {
            font-size: clamp(2.2rem, 6vw, 4.2rem);
            font-weight: 800;
            background: linear-gradient(135deg, #a78bfa 0%, #818cf8 45%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.15;
            margin-bottom: 18px;
            max-width: 700px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 1.05rem;
            line-height: 1.7;
            max-width: 500px;
            margin: 0 auto 40px;
        }

        .cta-btn {
            display: inline-block;
            padding: 16px 44px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
            color: #fff;
            text-decoration: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
            box-shadow: 0 8px 32px rgba(139, 92, 246, 0.35);
        }

        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 48px rgba(139, 92, 246, 0.5);
            filter: brightness(1.12);
        }

        .cta-btn:active {
            transform: translateY(0);
        }

        .stats {
            display: flex;
            gap: 40px;
            justify-content: center;
            margin-top: 56px;
            flex-wrap: wrap;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a78bfa, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #64748b;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-top: 4px;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(28px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer {
            position: fixed;
            bottom: 20px;
            font-size: 0.72rem;
            color: #475569;
        }
    </style>
</head>

<body>

    <div class="hero">
        <div class="badge">
            <span class="badge-dot"></span>
            ML-Powered Analytics
        </div>

        <h1>Predict Student Exam Performance</h1>

        <p class="subtitle">
            Harness the power of machine learning to predict student mathematics scores based on key demographic and
            academic factors.
        </p>

        <a id="get-started-btn" href="/predictdata" class="cta-btn">Get Started →</a>

        <div class="stats">
            <div class="stat">
                <div class="stat-value">7+</div>
                <div class="stat-label">Input Features</div>
            </div>
            <div class="stat">
                <div class="stat-value">ML</div>
                <div class="stat-label">Powered Model</div>
            </div>
            <div class="stat">
                <div class="stat-value">0–100</div>
                <div class="stat-label">Score Range</div>
            </div>
        </div>
    </div>

    <footer class="footer">Student Performance Prediction System &nbsp;·&nbsp; ML Project</footer>

</body>

</html>
